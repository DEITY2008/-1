name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Check web files
        run: test -f www/index.html || { echo "ไม่พบ www/index.html"; exit 1; }

      - name: Create Android project
        run: |
          mkdir -p app
          cp -r www app/www
          cd app
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/bluetooth-le@6
          npx cap init "RC Car" com.example.rccar --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Patch manifest (Bluetooth + landscape)
        working-directory: app
        run: |
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml'
          s=open(p).read()
          perm='''<uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
              <uses-feature android:name="android.hardware.bluetooth_le" android:required="false" />
              '''
          s=s.replace('<application',perm+'<application',1)
          s=s.replace('<activity','<activity android:screenOrientation="sensorLandscape"',1)
          open(p,'w').write(s)
          PY

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk rc-car.apk

      - uses: actions/upload-artifact@v4
        with:
          name: rc-car-apk
          path: rc-car.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RC Car build ${{ github.run_number }}
          files: rc-car.apk
